# Default values for QMLGreet
# qmlgreet.conf 2026 (c) Nitrux Latinoamericana S.C.

[General]
# Default session (leave empty to use first available)
# Put the exact name of the session as it appears in the list (e.g., Hyprland, or Hyprland (uwsm-managed)).
DefaultSession=Hyprland

[Appearance]

# Path to background image (leave empty for solid color)
BackgroundImage=/usr/share/wallpapers/Blossom/contents/images/4096x2304.png
BlurEnabled=true
OverlayEnabled=true
OverlayOpacity=0.76
IconMode=system

# Optional avatar image path or pattern.
# Supports %u for the username and %h for the user's home directory.
# Leave empty to use ~/.face, ~/.face.icon, or AccountsService.
AvatarImage=

[Clock]
# Render the date in lowercase (true/false)
LowercaseDate=false

[Debug]
# Show a dummy battery indicator even when no battery is present (true/false)
debugBattery=false

[Behavior]
# Show user avatars (true/false)
ShowAvatars=true
